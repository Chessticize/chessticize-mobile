<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <!-- Served for any missing URL at any depth, so asset paths cannot be
         relative. Root paths serve chessticize.com; the /chessticize-mobile/
         copies keep it styled on the legacy github.io project path. -->
    <link rel="icon" href="/assets/app-icon-192.png" sizes="192x192">
    <link rel="icon" href="/chessticize-mobile/assets/app-icon-192.png" sizes="192x192">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/chessticize-mobile/styles.css">
    <title>Page not found — Chessticize</title>
  </head>
  <body>
    <main id="main" class="simple-page section-shell">
      <div class="simple-page-header">
        <p class="eyebrow">404</p>
        <h1>This puzzle has no solution here.</h1>
        <p>The page moved, or the link was incomplete.</p>
        <a class="button button-primary" href="/">
          <strong>Return to Chessticize</strong>
        </a>
        <p>
          The Chessticize web app has been retired. Chessticize is now an
          iPhone, iPad and Android app.
        </p>
      </div>
    </main>
  </body>
</html>
