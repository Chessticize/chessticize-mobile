name: Development Process

on:
  pull_request:
    paths:
      - ".codex/skills/**"
      - "apps/mobile-lab/README.md"
      - ".github/pull_request_template.md"
      - ".github/workflows/**"
      - "AGENTS.md"
      - "README.md"
      - "docs/APP_STORE_UPLOAD.md"
      - "docs/ANDROID_GITHUB_RELEASE.md"
      - "docs/ANDROID_PLAY_RELEASE.md"
      - "docs/LANDING_PAGE.md"
      - "docs/RELEASE_NOTES.md"
      - "docs/RELEASE_VERSIONING.md"
      - "docs/releases/**"
      - "docs/RELEASE_SOURCE_POLICY.md"
      - "docs/STORYBOOK_DEPLOYMENT.md"
      - "docs/TESTFLIGHT_QA.md"
      - "docs/TESTING_ARCHITECTURE.md"
      - "docs/agents/**"
      - "package.json"
      - "apps/mobile/development-version.json"
      - "apps/mobile/release-version.json"
      - "apps/mobile/ios/Config/DevelopmentVersion.xcconfig"
      - "apps/mobile/ios/Config/ReleaseVersion.xcconfig"
      - "site/**"
      - "apps/mobile/__tests__/landingPage.test.js"
      - "scripts/prepare-landing-page-assets.mjs"
      - "scripts/lib/android-download-page.mjs"
      - "scripts/render-android-download-page.mjs"
      - "scripts/android-download-page.test.mjs"
      - "scripts/lib/mobile-versioning.mjs"
      - "scripts/mobile-version.mjs"
      - "scripts/mobile-versioning.test.mjs"
      - "scripts/validate-development-process.mjs"
      - "vercel.json"
  push:
    branches:
      - main
    paths:
      - ".codex/skills/**"
      - "apps/mobile-lab/README.md"
      - ".github/pull_request_template.md"
      - ".github/workflows/**"
      - "AGENTS.md"
      - "README.md"
      - "docs/APP_STORE_UPLOAD.md"
      - "docs/ANDROID_GITHUB_RELEASE.md"
      - "docs/ANDROID_PLAY_RELEASE.md"
      - "docs/LANDING_PAGE.md"
      - "docs/RELEASE_NOTES.md"
      - "docs/RELEASE_VERSIONING.md"
      - "docs/releases/**"
      - "docs/RELEASE_SOURCE_POLICY.md"
      - "docs/STORYBOOK_DEPLOYMENT.md"
      - "docs/TESTFLIGHT_QA.md"
      - "docs/TESTING_ARCHITECTURE.md"
      - "docs/agents/**"
      - "package.json"
      - "apps/mobile/development-version.json"
      - "apps/mobile/release-version.json"
      - "apps/mobile/ios/Config/DevelopmentVersion.xcconfig"
      - "apps/mobile/ios/Config/ReleaseVersion.xcconfig"
      - "site/**"
      - "apps/mobile/__tests__/landingPage.test.js"
      - "scripts/prepare-landing-page-assets.mjs"
      - "scripts/lib/android-download-page.mjs"
      - "scripts/render-android-download-page.mjs"
      - "scripts/android-download-page.test.mjs"
      - "scripts/lib/mobile-versioning.mjs"
      - "scripts/mobile-version.mjs"
      - "scripts/mobile-versioning.test.mjs"
      - "scripts/validate-development-process.mjs"
      - "vercel.json"

permissions:
  contents: read

concurrency:
  group: process-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: Validate development process
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26.x

      - name: Validate process policy and automation
        run: node scripts/validate-development-process.mjs
