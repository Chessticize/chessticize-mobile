name: Mobile Android test-only rerun

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Mobile Android run whose successful build artifact will be reused
        required: true
        type: string
      app_source_sha:
        description: Exact App source SHA recorded by the source run
        required: true
        type: string
      target:
        description: Smallest affected Android test scope
        required: true
        type: choice
        options:
          - api-24
          - api-24-backup-policy
          - api-36-full
          - android-offline-practice
          - android-arrow-duel
          - android-custom-practice
          - android-history
          - android-stockfish
          - android-system-back
          - android-review-reminders
          - flows
          - practice

permissions:
  actions: read
  contents: read

concurrency:
  group: mobile-android-test-only-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: true

jobs:
  android-test-only-rerun:
    name: Android test-only rerun (${{ inputs.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout test runner
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Authenticate the source run and successful build job
        env:
          APP_SOURCE_SHA: ${{ inputs.app_source_sha }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$APP_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" \
            > "$RUNNER_TEMP/source-run.json"
          jq -e \
            --arg app_source_sha "$APP_SOURCE_SHA" \
            '.event == "workflow_dispatch"
              and .path == ".github/workflows/mobile-android.yml"
              and .status == "completed"
              and .head_sha == $app_source_sha
              and .repository.full_name == env.GITHUB_REPOSITORY' \
            "$RUNNER_TEMP/source-run.json"
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?filter=latest" \
            > "$RUNNER_TEMP/source-jobs.json"
          jq -e \
            'any(.jobs[]; .name == "Android build baseline" and .conclusion == "success")' \
            "$RUNNER_TEMP/source-jobs.json"

      - name: Verify App build inputs are unchanged
        env:
          APP_SOURCE_SHA: ${{ inputs.app_source_sha }}
          TEST_RUNNER_SHA: ${{ github.sha }}
        run: >-
          node apps/mobile/scripts/mobile-app-inputs.js compare
          --app-source-sha "$APP_SOURCE_SHA"
          --test-runner-sha "$TEST_RUNNER_SHA"
          --output apps/mobile/artifacts/android-validation/app-input-comparison.json

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the retained App and test APKs
        uses: actions/download-artifact@v4
        with:
          name: android-practice-apks
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          path: apps/mobile/android/app/build/outputs/apk

      - name: Require both retained APKs
        run: |
          test -s apps/mobile/android/app/build/outputs/apk/e2e/app-e2e.apk
          test -s apps/mobile/android/app/build/outputs/apk/androidTest/e2e/app-e2e-androidTest.apk
          sha256sum \
            apps/mobile/android/app/build/outputs/apk/e2e/app-e2e.apk \
            apps/mobile/android/app/build/outputs/apk/androidTest/e2e/app-e2e-androidTest.apk

      - name: Resolve the selected test scope
        id: target
        env:
          TARGET: ${{ inputs.target }}
        run: |
          case "$TARGET" in
            api-24)
              echo "api-level=24" >> "$GITHUB_OUTPUT"
              echo "suite-args=--suite android-api24-smoke" >> "$GITHUB_OUTPUT"
              echo "runner=public-ui" >> "$GITHUB_OUTPUT"
              ;;
            api-24-backup-policy)
              echo "api-level=24" >> "$GITHUB_OUTPUT"
              echo "suite-args=" >> "$GITHUB_OUTPUT"
              echo "runner=backup-policy" >> "$GITHUB_OUTPUT"
              ;;
            api-36-full)
              echo "api-level=36" >> "$GITHUB_OUTPUT"
              echo "suite-args=" >> "$GITHUB_OUTPUT"
              echo "runner=public-ui" >> "$GITHUB_OUTPUT"
              ;;
            android-offline-practice|android-arrow-duel|android-custom-practice|android-history|android-stockfish|android-system-back|android-review-reminders|flows|practice)
              echo "api-level=36" >> "$GITHUB_OUTPUT"
              echo "suite-args=--suite $TARGET" >> "$GITHUB_OUTPUT"
              echo "runner=public-ui" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported Android test-only target $TARGET" >&2
              exit 1
              ;;
          esac

      - name: Enable KVM acceleration
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm

      - name: Run only the selected public-UI scope
        if: steps.target.outputs.runner == 'public-ui'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ steps.target.outputs.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          disk-size: 8192M
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: >-
            timeout --signal=TERM --kill-after=30s 30m
            pnpm mobile:validate:android:matrix --
            --api-level "${{ steps.target.outputs.api-level }}"
            ${{ steps.target.outputs.suite-args }}
            --output "apps/mobile/artifacts/android-validation/test-only-${{ inputs.target }}.json"
        env:
          DETOX_ANDROID_DEVICE: emulator-5554
          ANDROID_VALIDATION_COMMIT_SHA: ${{ github.sha }}
          ANDROID_VALIDATION_APP_SOURCE_SHA: ${{ inputs.app_source_sha }}
          ANDROID_VALIDATION_BUILD_RESULT: success
          ANDROID_VALIDATION_DEVICE_ABI: x86_64
          ANDROID_VALIDATION_DEVICE_PROFILE: pixel_2

      - name: Run only the API 24 backup-policy scope
        if: steps.target.outputs.runner == 'backup-policy'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 24
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          disk-size: 8192M
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: apps/mobile/scripts/android-progress-backup-policy-evidence.sh
        env:
          DETOX_ANDROID_DEVICE: emulator-5554
          GITHUB_SHA: ${{ github.sha }}

      - name: Upload passing test-only evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-only-${{ inputs.target }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            apps/mobile/artifacts/android-progress-backup-policy/
            apps/mobile/artifacts/android-validation/

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-only-${{ inputs.target }}-failure-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            apps/mobile/artifacts/android-ui/
            apps/mobile/artifacts/android-validation/
