name: Mobile Interaction Lab

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - ".github/workflows/mobile-lab.yml"
      - "apps/mobile-lab/**"
      - "apps/mobile/src/**"
      - "package.json"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "vercel.json"
      - "scripts/storybook-ci*"

permissions:
  contents: read
  actions: read

concurrency:
  group: mobile-lab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Select Storybook work
    if: github.event_name != 'push' || github.event.deleted == false
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.scope.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare with last successful branch run
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=""
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$(jq -r .created "$GITHUB_EVENT_PATH")" != "true" ]]; then
            base="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/mobile-lab.yml/runs" \
              -f branch="$GITHUB_REF_NAME" -f status=success -f per_page=100 \
              --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")][0].head_sha // ""')"
          fi
          build="$(node scripts/storybook-ci.mjs scope "$base")"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Storybook build required: $build; comparison base: ${base:-none (full build)}" >> "$GITHUB_STEP_SUMMARY"

  pr-markers:
    name: Interaction Lab PR marker check
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check markers against PR base without rebuilding
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: pnpm mobile:lab:check-markers

  validate:
    name: ${{ github.event_name == 'pull_request' && 'Fork Interaction Lab typecheck and build' || 'Interaction Lab typecheck and build' }}
    needs: scope
    if: >-
      needs.scope.outputs.build == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout without LFS assets
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, registry tests, and static Storybook build
        run: pnpm mobile:lab:validate

      - name: Validate issue-owned New Scenario Markers
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: pnpm mobile:lab:check-markers

      - name: Seal validated static output
        if: github.event_name != 'pull_request'
        run: node scripts/storybook-ci.mjs seal "$GITHUB_SHA"

      - name: Upload exact validated bundle
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: storybook-${{ github.sha }}-${{ github.run_id }}
          path: apps/mobile-lab/storybook-static/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  deploy:
    name: Deploy branch Storybook to Vercel
    if: >-
      (github.event_name == 'push' && github.event.deleted == false) ||
      github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: storybook/${{ github.ref_name }}
      url: ${{ steps.deploy.outputs.manager_url }}
    steps:
      - name: Checkout without LFS assets
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: pnpm

      - name: Require Vercel deployment credentials
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TEAM_TOKEN }}
        run: |
          if [[ -z "$VERCEL_TOKEN" || -z "$VERCEL_ORG_ID" || -z "$VERCEL_PROJECT_ID" ]]; then
            echo "::error::Configure VERCEL_TEAM_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID as GitHub Actions secrets."
            exit 1
          fi

      - name: Install locked JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel project settings
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TEAM_TOKEN }}
        run: |
          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            pnpm exec vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          else
            pnpm exec vercel pull --yes --environment=preview --git-branch="$GITHUB_REF_NAME" --token="$VERCEL_TOKEN"
          fi

      - name: Download exact validated bundle
        uses: actions/download-artifact@v4
        with:
          name: storybook-${{ github.sha }}-${{ github.run_id }}
          path: apps/mobile-lab/storybook-static/

      - name: Package the validated Storybook deployment
        env:
          STORYBOOK_PREBUILT: "1"
        run: |
          node scripts/storybook-ci.mjs verify "$GITHUB_SHA"
          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            pnpm exec vercel build --prod
          else
            pnpm exec vercel build
          fi

      - name: Deploy the exact branch commit
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TEAM_TOKEN }}
        run: |
          deploy_args=(
            --prebuilt
            --archive=tgz
            --token="$VERCEL_TOKEN"
            --meta=githubDeployment=1
            --meta=githubCommitRef="$GITHUB_REF_NAME"
            --meta=githubCommitSha="$GITHUB_SHA"
            --meta=githubOrg="$GITHUB_REPOSITORY_OWNER"
            --meta=githubRepo="${GITHUB_REPOSITORY#*/}"
            --meta=githubCommitOrg="$GITHUB_REPOSITORY_OWNER"
            --meta=githubCommitRepo="${GITHUB_REPOSITORY#*/}"
          )

          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            deploy_args+=(--prod)
          fi

          deployment_url="$(pnpm exec vercel deploy "${deploy_args[@]}")"
          immutable_url="${deployment_url%/}/"

          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            manager_url="https://storybook.chessticize.com/"
          else
            branch_alias="$(
              node -e '
                const branch = process.env.GITHUB_REF_NAME;
                const readable = branch
                  .toLowerCase()
                  .replace(/[^a-z0-9]+/g, "-")
                  .replace(/^-+|-+$/g, "")
                  .slice(0, 24)
                  .replace(/-+$/g, "") || "branch";
                const digest = require("node:crypto")
                  .createHash("sha256")
                  .update(branch)
                  .digest("hex")
                  .slice(0, 8);
                const slug = `${readable}-${digest}`;
                process.stdout.write(`chessticize-mobile-storybook-${slug}.vercel.app`);
              '
            )"
            pnpm exec vercel alias set "$deployment_url" "$branch_alias" --token="$VERCEL_TOKEN"
            manager_url="https://${branch_alias}/"
          fi

          echo "manager_url=$manager_url" >> "$GITHUB_OUTPUT"
          echo "immutable_url=$immutable_url" >> "$GITHUB_OUTPUT"

      - name: Verify public Storybook access
        env:
          IMMUTABLE_URL: ${{ steps.deploy.outputs.immutable_url }}
          STORYBOOK_URL: ${{ steps.deploy.outputs.manager_url }}
        run: |
          verify_public_url() {
            local url="$1"
            local status="000"

            for attempt in 1 2 3 4 5; do
              status="$(curl --location --silent --output /dev/null --write-out '%{http_code}' "$url")"
              if [[ "$status" == "200" ]]; then
                return 0
              fi
              sleep "$((attempt * 2))"
            done

            echo "::error::Unauthenticated Storybook request returned HTTP $status for $url"
            return 1
          }

          verify_public_url "$IMMUTABLE_URL"
          verify_public_url "$STORYBOOK_URL"
          verify_public_url "${IMMUTABLE_URL}storybook/"
          verify_public_url "${STORYBOOK_URL}storybook/"
          for root in "$IMMUTABLE_URL" "$STORYBOOK_URL"; do
            actual_sha="$(curl --fail --silent --show-error "${root}codex-build.json" | jq -r .sourceSha)"
            [[ "$actual_sha" == "$GITHUB_SHA" ]] || { echo "::error::Deployed source SHA mismatch"; exit 1; }
          done

          {
            echo "## Storybook deployment"
            echo
            echo "- Branch: \`$GITHUB_REF_NAME\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Manager: $STORYBOOK_URL"
            echo "- Exact deployment: $IMMUTABLE_URL"
            echo "- Compatibility path: ${STORYBOOK_URL}storybook/"
            echo "- Anonymous access: HTTP 200 at both root and \`/storybook/\`"
          } >> "$GITHUB_STEP_SUMMARY"
